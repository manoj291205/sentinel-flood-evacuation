# Pinned light theme so the demo looks identical on any machine. The data-viz palette
# used in the dashboard was validated against the light surface (#fcfcfb); letting the
# viewer's OS flip this to dark mid-demo would invalidate those contrast results.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false
