name: tests

# Runs the OFFLINE test suite only. No GEMINI_API_KEY, no network calls, no model
# downloads -- the invariants under test (masking, schema validation, grounding, reward
# arithmetic, eval-suite integrity) are all pure logic.
on:
  push:
    branches: [main, "m*", "lane-x/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install CPU-only torch (Linux)
        # The default Linux wheel bundles CUDA and fills the runner disk.
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-api.txt

      - name: Assert no API key is present
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY unexpectedly set"; exit 1; fi
          echo "no API key present, as intended"

      - name: Run tests
        run: python -m pytest tests/ -p no:cacheprovider -o addopts="" -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e

  web-live:
    # Skipped until the live-demo end-to-end spec (Phase 34A) exists.
    if: hashFiles('web/e2e/p34a_live_demo.spec.ts') != ''
    needs: web
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install CPU-only torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-api.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Live end-to-end
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chrome
          npm run test:e2e:live

  docker:
    # Skipped until the recorded demo trace (Phase 34A) exists.
    if: hashFiles('data/demo_v4/demo_trace.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the checker's only dependency
        run: python -m pip install jsonschema==4.26.0

      - name: Build image
        run: docker build -t sentinel-demo .

      - name: Run container
        run: docker run -d --name sentinel-demo -p 8000:8000 -e SENTINEL_DEMO_PASSWORD=ci-only-password sentinel-demo

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs sentinel-demo
          exit 1

      - name: Deploy check
        run: python scripts/deploy_check.py http://127.0.0.1:8000 --password ci-only-password
