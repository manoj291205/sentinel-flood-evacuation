name: tests

# Runs the OFFLINE test suite only. No GEMINI_API_KEY, no network calls, no model
# downloads -- the invariants under test (masking, schema validation, grounding, reward
# arithmetic, eval-suite integrity) are all pure logic.
on:
  push:
    branches: [main, "m*", "builder-x/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assert no API key is present
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY unexpectedly set"; exit 1; fi
          echo "no API key present, as intended"

      - name: Run tests
        run: python -m pytest tests/ -p no:cacheprovider -o addopts="" -q
