name: tests

# Runs the OFFLINE test suite only. No GEMINI_API_KEY, no network calls, no model
# downloads -- the invariants under test (masking, schema validation, grounding, reward
# arithmetic, eval-suite integrity) are all pure logic.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        # The current offline suite imports Streamlit, graph routing and saved PPO
        # checkpoints. Install their declared dependencies without downloading models.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assert no API key is present
        # The suite must never depend on a secret. If it does, this job would pass
        # locally and fail for anyone else.
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY unexpectedly set"; exit 1; fi
          echo "no API key present, as intended"

      - name: Run tests
        run: python -m pytest tests/ -v
